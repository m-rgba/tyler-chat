services:
  postgres:
    image: postgres:16
    container_name: tyler-postgres
    environment:
      POSTGRES_DB: ${TYLER_DB_NAME:-tyler}
      POSTGRES_USER: ${TYLER_DB_USER:-tyler}
      POSTGRES_PASSWORD: ${TYLER_DB_PASSWORD:-tyler_dev}
    env_file:
      - ./backend/.env
    ports:
      - "${TYLER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TYLER_DB_USER:-tyler}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tyler-backend
    env_file:
      - ./backend/.env
    ports:
      - "${TYLER_BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/src
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tyler-frontend
    ports:
      - "${TYLER_FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/src

volumes:
  postgres_data: